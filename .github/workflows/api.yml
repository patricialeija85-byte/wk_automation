name: Api Testing

on:
  push:
    branches: [ "development" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Automation Tests
        run: mvn test -Dheadless=true -Dbrowser=chrome -Dcucumber.filter.tags="@api"

      - name: Upload Extent Report
        uses: actions/upload-artifact@v4
        with:
            name: extent-report-automation
            path: target/extent-reports/
            retention-days: 30
